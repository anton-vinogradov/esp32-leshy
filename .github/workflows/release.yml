name: release

# Tag a commit v1.2.3 and push it: this builds the firmware with that version baked
# in and attaches two artifacts to the GitHub release:
#   - firmware.bin          the app image, used by the in-app OTA updater (Settings -> Update)
#   - firmware.factory.bin  the merged bootloader+partitions+app, used by the web
#                           installer (ESP Web Tools) for first-time flashing of a blank chip
# The web installer points at /releases/latest/download/firmware.factory.bin, so keeping
# that exact filename lets the installer always fetch the newest release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Bake the tag version into the firmware
        run: |
          VER="${GITHUB_REF_NAME#v}"          # v1.2.3 -> 1.2.3
          DATE="$(date -u +%d.%m.%Y)"
          printf '#pragma once\n#define LESHY_FW_VERSION "%s"\n#define LESHY_FW_DATE "%s"\n' "$VER" "$DATE" > src/core/version.h
          echo "Building ESP32-Leshy $VER ($DATE)"; cat src/core/version.h

      - name: Build firmware
        run: pio run -e esp32-div

      - name: Build device-DB filesystem image
        run: |
          python tools/make_devicedb.py          # fetch SIG company IDs + IEEE OUI, emit data/*.bin
          pio run -e esp32-div -t buildfs         # -> .pio/build/esp32-div/littlefs.bin

      - name: Attach firmware to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .pio/build/esp32-div/firmware.bin
            .pio/build/esp32-div/firmware.factory.bin
            .pio/build/esp32-div/littlefs.bin
          fail_on_unmatched_files: true
