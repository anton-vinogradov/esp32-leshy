name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate documentation source of truth
        run: python3 tools/check_docs.py

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Retained acceptance checkers intentionally bind runner/source blobs to
          # their historical exact-candidate commits via `git show <sha>:<path>`.
          fetch-depth: 0
          persist-credentials: false
      - name: Test hardware-independent core
        run: tools/test.sh

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python3 -m pip install platformio==6.1.19
      - name: Build firmware
        run: pio run -e esp32-div
      - name: Build isolated S1 HIL probe
        run: pio run -d diagnostics/hil_probe
      - name: Build independent 1.x measurement target
        run: pio run -d firmware/leshy1
