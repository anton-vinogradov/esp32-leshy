name: prerelease-hil

run-name: prerelease-hil / ${{ inputs.version }} / ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version embedded in the 1.x candidate
        required: true
        type: string
      request_id:
        description: Unique invocation ID generated by tools/release_1x.py
        required: true
        type: string
      hil_port:
        description: Serial port of the explicitly attached release board
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: esp32-div-v2-hil-board-01
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and attest candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Read embedded version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          ACTUAL_VERSION="$(python3 tools/read_1x_version.py)"
          test "$ACTUAL_VERSION" = "$REQUESTED_VERSION"
          echo "value=$ACTUAL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run host contracts
        run: tools/test.sh

      - name: Install PlatformIO
        run: python3 -m pip install platformio==6.1.19

      - name: Build candidate once
        run: pio run -d firmware/leshy1

      - name: Stage exact candidate
        run: |
          mkdir -p dist/candidate
          cp firmware/leshy1/.pio/build/esp32-div-v2-clean/firmware.bin dist/candidate/firmware.bin
          cp firmware/leshy1/.pio/build/esp32-div-v2-clean/firmware.factory.bin dist/candidate/firmware.factory.bin
          cp firmware/leshy1/.pio/build/esp32-div-v2-clean/firmware.elf dist/candidate/firmware.elf
          cp firmware/leshy1/.pio/build/esp32-div-v2-clean/firmware.map dist/candidate/firmware.map
          sha256sum dist/candidate/*

      - name: GitHub-attest candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/candidate/*

      - name: Retain candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leshy1-candidate
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 30

  physical-hil:
    name: Flash, exercise, capture, and attest board-01
    needs: candidate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: hil-production
    runs-on: [self-hosted, leshy-hil, esp32-div-v2]
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      HIL_PORT: ${{ inputs.hil_port }}
      SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/prerelease-hil.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require attached station configuration
        run: |
          test -n "$HIL_PORT"
          command -v gh

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leshy1-candidate
          path: candidate

      - name: Verify candidate GitHub provenance before flash
        run: |
          gh attestation verify candidate/firmware.bin \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA"

      - name: Prepare isolated HIL Python
        run: |
          python3 -m venv "$RUNNER_TEMP/hil-venv"
          "$RUNNER_TEMP/hil-venv/bin/python" -m pip install \
            --requirement tools/requirements-hil.txt

      - name: Run physical device-smoke
        id: hil
        run: |
          "$RUNNER_TEMP/hil-venv/bin/python" tools/run_1x_prerelease_hil.py \
            --port "$HIL_PORT" \
            --suite tests/hil/device-smoke.v1.json \
            --firmware candidate/firmware.bin \
            --expected-version "${{ needs.candidate.outputs.version }}" \
            --output "$RUNNER_TEMP/hil-bundle" \
            --flash

      - name: Verify local evidence contracts
        id: local_verify
        run: |
          "$RUNNER_TEMP/hil-venv/bin/python" tools/verify_1x_prerelease_bundle.py \
            --bundle "$RUNNER_TEMP/hil-bundle" \
            --candidate candidate/firmware.bin \
            --suite-id device-smoke \
            --suite-revision 1 \
            --expected-version "${{ needs.candidate.outputs.version }}" \
            --allow-unsigned-local-result

      - name: Package self-contained evidence
        id: package
        if: always() && steps.hil.outcome != 'skipped'
        run: |
          python3 tools/package_1x_prerelease_bundle.py \
            --bundle "$RUNNER_TEMP/hil-bundle" \
            --output "$RUNNER_TEMP/hil-evidence.tar.gz"

      - name: GitHub-attest passed physical evidence
        if: >-
          steps.hil.outcome == 'success' &&
          steps.local_verify.outcome == 'success' &&
          steps.package.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/hil-evidence.tar.gz

      - name: Retain evidence, including failed runs
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leshy1-hil-evidence
          path: ${{ runner.temp }}/hil-evidence.tar.gz
          if-no-files-found: error
          retention-days: 30

  promotion-proof:
    name: Re-verify exact bytes and GitHub provenance
    needs: [candidate, physical-hil]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/prerelease-hil.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leshy1-candidate
          path: candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leshy1-hil-evidence
          path: evidence

      - name: Verify both GitHub attestations
        run: |
          for artifact in candidate/*; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA"
          done
          gh attestation verify evidence/hil-evidence.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA"

      - name: Re-verify bundle and exact candidate binding
        run: |
          tar -xzf evidence/hil-evidence.tar.gz
          python3 tools/verify_1x_prerelease_bundle.py \
            --bundle hil-bundle \
            --candidate candidate/firmware.bin \
            --suite-id device-smoke \
            --suite-revision 1 \
            --expected-version "${{ needs.candidate.outputs.version }}" \
            --allow-unsigned-local-result

      - name: Mark exact candidate as promotion-ready
        run: sha256sum candidate/firmware.bin
