; S1 evidence tool. This is intentionally isolated from both the 0.x firmware and
; the future 1.x product target. See docs/v1/HIL_PROBE.md.

[env:esp32-div-hil-probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; An 8 MB image header boots on the current prototype target and on the N16 module
; named by the BOM. The probe reads the physical flash identity at runtime; it does
; not claim that this partition layout is the 1.x release layout.
board_build.partitions = default_8MB.csv

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LESHY_HIL_PROBE_VERSION=\"0.1.1\"

build_unflags =
    -D CORE_DEBUG_LEVEL=2
