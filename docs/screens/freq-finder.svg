<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="Sub-GHz frequency finder">
  <title>ESP32-Leshy — frequency finder</title>
  <defs><style>text{font-family:Verdana,Geneva,'DejaVu Sans',sans-serif}.b{font-weight:700}</style></defs>
  <rect width="240" height="320" rx="8" fill="#101812"/>
  <rect width="240" height="28" fill="#1e3a28"/>
  <text x="8" y="20" class="b" font-size="16" fill="#e7cf8f">Частотомер</text>
  <text x="232" y="20" font-size="12" fill="#8fa98f" text-anchor="end">CC1101</text>

  <!-- readout -->
  <text x="10" y="72" class="b" font-size="34" fill="#3fe07a">868.35</text>
  <text x="150" y="72" font-size="13" fill="#e8e8e0">МГц</text>
  <text x="150" y="52" font-size="13" fill="#e7cf8f">868 ISM</text>
  <text x="10" y="104" font-size="13" fill="#e8e8e0">подъём пика +32 dB</text>

  <!-- graph box 120..250 -->
  <line x1="0" y1="250" x2="240" y2="250" stroke="#405044"/>
  <!-- noise ripple -->
  <g fill="#2c4030">
    <rect x="4" y="246" width="2" height="4"/><rect x="14" y="244" width="2" height="6"/><rect x="24" y="247" width="2" height="3"/>
    <rect x="34" y="243" width="2" height="7"/><rect x="44" y="246" width="2" height="4"/><rect x="54" y="245" width="2" height="5"/>
    <rect x="64" y="242" width="2" height="8"/><rect x="74" y="246" width="2" height="4"/><rect x="94" y="244" width="2" height="6"/>
    <rect x="104" y="247" width="2" height="3"/><rect x="114" y="245" width="2" height="5"/><rect x="124" y="243" width="2" height="7"/>
    <rect x="134" y="246" width="2" height="4"/><rect x="144" y="244" width="2" height="6"/><rect x="154" y="247" width="2" height="3"/>
    <rect x="164" y="245" width="2" height="5"/><rect x="174" y="246" width="2" height="4"/><rect x="200" y="244" width="2" height="6"/>
    <rect x="210" y="247" width="2" height="3"/><rect x="220" y="245" width="2" height="5"/><rect x="230" y="243" width="2" height="7"/>
  </g>
  <!-- a small green rise around 433 -->
  <rect x="82" y="232" width="2" height="18" fill="#3fe07a"/>
  <rect x="85" y="238" width="2" height="12" fill="#3fe07a"/>
  <!-- the dominant gold peak at ~868 -->
  <rect x="184" y="156" width="3" height="94" fill="#e7cf8f"/>
  <rect x="187" y="168" width="2" height="82" fill="#3fe07a"/>
  <rect x="181" y="182" width="2" height="68" fill="#3fe07a"/>

  <!-- ISM ticks -->
  <g fill="#8fa98f" font-size="10" text-anchor="middle" font-family="Verdana,sans-serif">
    <line x1="13"  y1="251" x2="13"  y2="254" stroke="#405044"/><text x="13"  y="264">315</text>
    <line x1="83"  y1="251" x2="83"  y2="254" stroke="#405044"/><text x="83"  y="264">433</text>
    <line x1="188" y1="251" x2="188" y2="254" stroke="#405044"/><text x="188" y="264">868</text>
    <line x1="228" y1="251" x2="228" y2="254" stroke="#405044"/><text x="228" y="264">915</text>
  </g>

  <line x1="0" y1="300" x2="240" y2="300" stroke="#1e3a28"/>
  <text x="6" y="314" font-size="11" fill="#9aaa9a">◀ назад</text>
  <text x="234" y="314" font-size="11" fill="#9aaa9a" text-anchor="end">▶ калибровать</text>
</svg>
