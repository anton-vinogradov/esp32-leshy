<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="On-screen keyboard">
  <title>ESP32-Leshy — on-screen keyboard</title>
  <defs><style>
    text{font-family:Verdana,Geneva,'DejaVu Sans',sans-serif}
    .k{fill:#e8e8e0;font-size:13px;text-anchor:middle}
    .kc rect{fill:#1b271b;rx:4}
  </style></defs>
  <rect width="240" height="320" rx="8" fill="#101812"/>
  <rect width="240" height="28" fill="#1e3a28"/>
  <text x="8" y="20" font-weight="700" font-size="16" fill="#e7cf8f">Имя записи</text>

  <text x="10" y="62" font-weight="700" font-size="24" fill="#e7cf8f">GATE_</text>

  <!-- key backgrounds -->
  <g class="kc">
    <rect x="6" y="80" width="21" height="30"/><rect x="29" y="80" width="21" height="30"/><rect x="52" y="80" width="21" height="30"/><rect x="75" y="80" width="21" height="30"/><rect x="98" y="80" width="21" height="30"/><rect x="121" y="80" width="21" height="30"/><rect x="144" y="80" width="21" height="30"/><rect x="167" y="80" width="21" height="30"/><rect x="190" y="80" width="21" height="30"/><rect x="213" y="80" width="21" height="30"/>
    <rect x="6" y="114" width="21" height="30"/><rect x="29" y="114" width="21" height="30"/><rect x="52" y="114" width="21" height="30"/><rect x="75" y="114" width="21" height="30"/><rect x="98" y="114" width="21" height="30"/><rect x="121" y="114" width="21" height="30"/><rect x="144" y="114" width="21" height="30"/><rect x="167" y="114" width="21" height="30"/><rect x="213" y="114" width="21" height="30"/>
    <rect x="6" y="148" width="21" height="30"/><rect x="29" y="148" width="21" height="30"/><rect x="52" y="148" width="21" height="30"/><rect x="75" y="148" width="21" height="30"/><rect x="98" y="148" width="21" height="30"/><rect x="121" y="148" width="21" height="30"/><rect x="144" y="148" width="21" height="30"/><rect x="167" y="148" width="21" height="30"/><rect x="190" y="148" width="21" height="30"/><rect x="213" y="148" width="21" height="30"/>
    <rect x="6" y="182" width="21" height="30"/><rect x="29" y="182" width="21" height="30"/><rect x="52" y="182" width="21" height="30"/><rect x="75" y="182" width="21" height="30"/><rect x="98" y="182" width="21" height="30"/><rect x="121" y="182" width="21" height="30"/><rect x="144" y="182" width="21" height="30"/><rect x="167" y="182" width="21" height="30"/><rect x="190" y="182" width="21" height="30"/><rect x="213" y="182" width="21" height="30"/>
  </g>
  <!-- selected key -->
  <rect x="190" y="114" width="21" height="30" rx="4" fill="#2c5a2c" stroke="#e7cf8f"/>

  <!-- letters -->
  <g class="k">
    <text x="16.5" y="100">A</text><text x="39.5" y="100">B</text><text x="62.5" y="100">C</text><text x="85.5" y="100">D</text><text x="108.5" y="100">E</text><text x="131.5" y="100">F</text><text x="154.5" y="100">G</text><text x="177.5" y="100">H</text><text x="200.5" y="100">I</text><text x="223.5" y="100">J</text>
    <text x="16.5" y="134">K</text><text x="39.5" y="134">L</text><text x="62.5" y="134">M</text><text x="85.5" y="134">N</text><text x="108.5" y="134">O</text><text x="131.5" y="134">P</text><text x="154.5" y="134">Q</text><text x="177.5" y="134">R</text><text x="200.5" y="134" fill="#e7cf8f" font-weight="700">S</text><text x="223.5" y="134">T</text>
    <text x="16.5" y="168">U</text><text x="39.5" y="168">V</text><text x="62.5" y="168">W</text><text x="85.5" y="168">X</text><text x="108.5" y="168">Y</text><text x="131.5" y="168">Z</text><text x="154.5" y="168">0</text><text x="177.5" y="168">1</text><text x="200.5" y="168">2</text><text x="223.5" y="168">3</text>
    <text x="16.5" y="202">4</text><text x="39.5" y="202">5</text><text x="62.5" y="202">6</text><text x="85.5" y="202">7</text><text x="108.5" y="202">8</text><text x="131.5" y="202">9</text><text x="154.5" y="202">-</text><text x="177.5" y="202">_</text><text x="200.5" y="202">.</text><text x="223.5" y="202">,</text>
  </g>

  <!-- special row -->
  <g class="kc">
    <rect x="6" y="216" width="56" height="30"/><rect x="64" y="216" width="56" height="30"/><rect x="122" y="216" width="56" height="30"/><rect x="180" y="216" width="56" height="30"/>
  </g>
  <g class="k">
    <text x="34" y="236">SPC</text><text x="92" y="236">DEL</text><text x="150" y="236" fill="#3fe07a" font-weight="700">OK</text><text x="208" y="236">ESC</text>
  </g>

  <line x1="0" y1="300" x2="240" y2="300" stroke="#1e3a28"/>
  <text x="120" y="314" font-size="11" fill="#9aaa9a" text-anchor="middle">◀ ▶ ▼ ▲  выбор     OK  ввод</text>
</svg>
