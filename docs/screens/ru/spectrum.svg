<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="2.4 GHz spectrum waterfall">
  <title>ESP32-Leshy — 2.4 GHz spectrum</title>
  <defs>
    <style>text{font-family:Verdana,Geneva,'DejaVu Sans',sans-serif}</style>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152418"/><stop offset="0.45" stop-color="#2a7a44"/>
      <stop offset="0.78" stop-color="#4cd164"/><stop offset="1" stop-color="#f0c43a"/>
    </linearGradient>
    <linearGradient id="heat2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152418"/><stop offset="0.6" stop-color="#3a9a52"/>
      <stop offset="1" stop-color="#d14c4c"/>
    </linearGradient>
    <pattern id="scan" width="6" height="5" patternUnits="userSpaceOnUse">
      <rect width="6" height="5" fill="none"/><rect width="6" height="1" y="4" fill="#000" fill-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="240" height="320" rx="8" fill="#101812"/>
  <rect width="240" height="28" fill="#1e3a28"/>
  <text x="8" y="20" font-weight="700" font-size="16" fill="#e7cf8f">Спектр 2.4ГГц</text>
  <text x="232" y="20" font-size="12" fill="#8fa98f" text-anchor="end">nRF24</text>

  <!-- waterfall -->
  <rect x="0" y="32" width="240" height="240" fill="#0c130e"/>
  <!-- Wi-Fi channel bands 1 / 6 / 11 -->
  <rect x="4"  y="32" width="38" height="240" fill="url(#heat)"  opacity="0.92"/>
  <rect x="51" y="32" width="38" height="240" fill="url(#heat2)" opacity="0.92"/>
  <rect x="99" y="32" width="38" height="240" fill="url(#heat)"  opacity="0.92"/>
  <!-- Bluetooth / stray hops scattered across the band -->
  <g fill="#5fe0c0">
    <rect x="150" y="70"  width="3" height="4"/><rect x="171" y="120" width="3" height="4"/><rect x="205" y="90" width="3" height="4"/>
    <rect x="160" y="180" width="3" height="4"/><rect x="220" y="150" width="3" height="4"/><rect x="188" y="210" width="3" height="4"/>
    <rect x="146" y="240" width="3" height="4"/><rect x="212" y="205" width="3" height="4"/><rect x="176" y="60" width="3" height="4"/>
    <rect x="230" y="112" width="3" height="4"/><rect x="198" y="150" width="3" height="4"/><rect x="158" y="98" width="3" height="4"/>
  </g>
  <!-- scan-line texture -->
  <rect x="0" y="32" width="240" height="240" fill="url(#scan)"/>

  <!-- channel axis -->
  <text x="23"  y="286" font-size="11" fill="#8fa98f" text-anchor="middle" font-weight="700">1</text>
  <text x="70"  y="286" font-size="11" fill="#8fa98f" text-anchor="middle" font-weight="700">6</text>
  <text x="118" y="286" font-size="11" fill="#8fa98f" text-anchor="middle" font-weight="700">11</text>
  <text x="200" y="286" font-size="10" fill="#5c6b5c" text-anchor="middle">Wi-Fi каналы</text>

  <line x1="0" y1="300" x2="240" y2="300" stroke="#1e3a28"/>
  <text x="6" y="314" font-size="11" fill="#9aaa9a">◀ назад</text>
  <text x="234" y="314" font-size="11" fill="#9aaa9a" text-anchor="end">▶ вид</text>
</svg>
