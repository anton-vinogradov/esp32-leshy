<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="ESP32-Leshy main menu">
  <title>ESP32-Leshy — main menu</title>
  <defs><style>text{font-family:Verdana,Geneva,'DejaVu Sans',sans-serif}.b{font-weight:700}</style></defs>
  <rect width="240" height="320" rx="8" fill="#101812"/>
  <rect width="240" height="28" fill="#1e3a28"/>
  <text x="8" y="20" class="b" font-size="16" fill="#e7cf8f">ESP32-Leshy</text>
  <circle cx="228" cy="14" r="4" fill="#4cd164"/>

  <!-- selected card -->
  <rect x="6" y="32" width="228" height="52" rx="6" fill="#24402c" stroke="#e7cf8f"/>
  <rect x="8" y="34" width="224" height="48" rx="5" fill="none" stroke="#e7cf8f" stroke-opacity="0.5"/>
  <text x="16" y="56" class="b" font-size="16" fill="#e7cf8f">Wi-Fi</text>
  <text x="16" y="74" font-size="12" fill="#8fa98f">Сканирование сетей</text>

  <rect x="6" y="86" width="228" height="52" rx="6" fill="#18241a" stroke="#354a38"/>
  <text x="16" y="110" class="b" font-size="16" fill="#e8e8e0">BLE</text>
  <text x="16" y="128" font-size="12" fill="#8fa98f">Устройства и метки</text>

  <rect x="6" y="140" width="228" height="52" rx="6" fill="#18241a" stroke="#354a38"/>
  <text x="16" y="164" class="b" font-size="16" fill="#e8e8e0">Sub-GHz</text>
  <text x="16" y="182" font-size="12" fill="#8fa98f">Радио 315/433/868 МГц</text>

  <rect x="6" y="194" width="228" height="52" rx="6" fill="#18241a" stroke="#354a38"/>
  <text x="16" y="218" class="b" font-size="16" fill="#e8e8e0">Настройки</text>
  <text x="16" y="236" font-size="12" fill="#8fa98f">Язык, тач, о девайсе</text>

  <text x="120" y="300" font-size="11" fill="#5c6b5c" text-anchor="middle">▲ ▼  выбор   ·   OK  вход</text>
</svg>
