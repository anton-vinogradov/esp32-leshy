<!doctype html><html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#0c110e;font-family:Verdana,sans-serif;color:#cfe0d0;padding:24px}
  h1{font-size:20px;color:#e7cf8f;margin:0 0 4px}
  p{color:#7d8c7e;margin:0 0 22px;font-size:13px}
  .row{display:flex;flex-wrap:wrap;gap:22px}
  .dev{text-align:center}
  .frame{background:#05080600;border:2px solid #223026;border-radius:16px;padding:8px;box-shadow:0 8px 24px #0008}
  .frame img{display:block;width:200px;height:auto;border-radius:8px}
  .cap{margin-top:8px;font-size:12px;color:#9fb0a0}
</style></head><body>
  <h1>ESP32-Leshy — экраны</h1>
  <p>Мокапы UI (240×320), точная палитра прошивки.</p>
  <div class="row">
    <div class="dev"><div class="frame"><img src="menu.svg"></div><div class="cap">Главное меню</div></div>
    <div class="dev"><div class="frame"><img src="wifi.svg"></div><div class="cap">Скан Wi-Fi</div></div>
    <div class="dev"><div class="frame"><img src="freq-finder.svg"></div><div class="cap">Частотомер</div></div>
    <div class="dev"><div class="frame"><img src="keyboard.svg"></div><div class="cap">Клавиатура</div></div>
    <div class="dev"><div class="frame"><img src="spectrum.svg"></div><div class="cap">Спектр 2.4</div></div>
  </div>
</body></html>
