; ESP32-Leshy — firmware for ESP32-DIV (ESP32-S3) hardware.
; WORK IN PROGRESS: board pin map and lib_deps are filled in per module as they land.

[env:esp32-div]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3

; Libraries are added as modules land, e.g.:
; lib_deps =
;     bodmer/TFT_eSPI
;     nrf24/RF24
;     h2zero/NimBLE-Arduino
;     mikalhart/TinyGPSPlus
;     crankyoldgit/IRremoteESP8266
;     jgromes/RadioLib            ; CC1101 Sub-GHz
