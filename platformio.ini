; ESP32-Leshy 0.x + feasibility prototype build, not the independent 1.x target.
; The normative 1.x hardware map is docs/v1/HARDWARE_ENVELOPE.md.

[env:esp32-div]
; Pinned to the exact pioarduino platform the code targets (arduino-esp32 3.3.9) so
; CI matches local — the default registry's espressif32 is a different, older core
; whose BLE API breaks this build.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Kept for prototype compatibility. The v2 BOM says N16 (16 MB, no PSRAM), but the
; independent 1.x partition profile is gated by runtime/HIL memory evidence HW-T01.
board_build.partitions = default_8MB.csv    ; two OTA app slots (ota_0/ota_1) — required for in-app updates
board_build.filesystem = littlefs           ; spiffs partition holds a LittleFS image (recorder + optional maker-DB blobs)
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.12.3

; Legacy TFT_eSPI flags from upstream User_Setup v2.h. The schematic connects TFT
; RESET to RESET/EN, while this setup uses BOOT GPIO0. Do not copy TFT_RST=0 into
; the 1.x target; use external reset until continuity test HW-T02 resolves it.
build_flags =
    -D CORE_DEBUG_LEVEL=2
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D USE_HSPI_PORT=1
    -D TFT_MISO=37
    -D TFT_MOSI=35
    -D TFT_SCLK=36
    -D TFT_CS=17
    -D TFT_DC=16
    -D TFT_RST=0
    -D TOUCH_CS=18
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

; BLE uses the core's built-in Bluedroid stack (no external lib) — NimBLE-Arduino
; 1.4.x clashes with Arduino-ESP32 3.x (IDF 5.x) and boot-loops.
; More libs as the external-module features land (need the board pin map):
;     nrf24/RF24 ; jgromes/RadioLib ; mikalhart/TinyGPSPlus ; crankyoldgit/IRremoteESP8266
