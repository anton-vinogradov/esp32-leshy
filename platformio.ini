; ESP32-Leshy — firmware for ESP32-DIV (ESP32-S3) hardware.
; WORK IN PROGRESS: board pin map and lib_deps are filled in per module as they land.

[env:esp32-div]
; Pinned so CI builds with the exact core the code targets (arduino-esp32 3.3.9);
; newer cores change the BLE API and break the build.
platform = espressif32@55.3.39
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv    ; two OTA app slots (ota_0/ota_1) — required for in-app updates
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0

; TFT_eSPI pin map for ESP32-DIV v2 (from the upstream User_Setup v2.h, MIT).
; Configured via build flags so we don't edit the library's User_Setup.h.
build_flags =
    -D CORE_DEBUG_LEVEL=2
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D USE_HSPI_PORT=1
    -D TFT_MISO=37
    -D TFT_MOSI=35
    -D TFT_SCLK=36
    -D TFT_CS=17
    -D TFT_DC=16
    -D TFT_RST=0
    -D TOUCH_CS=18
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

; BLE uses the core's built-in Bluedroid stack (no external lib) — NimBLE-Arduino
; 1.4.x clashes with Arduino-ESP32 3.x (IDF 5.x) and boot-loops.
; More libs as the external-module features land (need the board pin map):
;     nrf24/RF24 ; jgromes/RadioLib ; mikalhart/TinyGPSPlus ; crankyoldgit/IRremoteESP8266
