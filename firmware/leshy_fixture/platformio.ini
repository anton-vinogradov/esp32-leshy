; Separate test-only ESP32-DIV image. It is never linked into product firmware.
; Boot is inactive; only source-bound fixed IR, minimum-power nRF24, and
; minimum-power finite CC1101 vectors are permitted by the exact host/session
; contract.

[env:esp32-div-v2-signal-fixture]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++2a
    -std=gnu++2b
    -D CORE_DEBUG_LEVEL=2

build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LESHY_FIXTURE_VERSION=\"0.3.0-subghz-safe\"
