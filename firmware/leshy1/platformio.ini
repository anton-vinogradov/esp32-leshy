; Independent ESP32-Leshy 1.x measurement target.
; It compiles no 0.x source, initializes the reviewed display/input path, and leaves
; radio/storage paths untouched unless a guarded evidence fixture explicitly owns them.

[env:esp32-div-v2-clean]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9-libs.tar.xz
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
board_build.embed_files =
    assets/oui.bin
    assets/bluetooth_companies.bin

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    adafruit/Adafruit NeoPixel@1.12.3

build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++2a
    -std=gnu++2b
    -D CORE_DEBUG_LEVEL=2

build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LESHY1_VERSION=\"0.188.0-companion-web-client-budget\"
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D USE_HSPI_PORT=1
    -D TFT_MISO=37
    -D TFT_MOSI=35
    -D TFT_SCLK=36
    -D TFT_CS=17
    -D TFT_DC=16
    -D TFT_RST=-1
    -D TOUCH_CS=18
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
